<!doctype html>

<html
  lang="en"
  class="light-style layout-wide customizer-hide"
  dir="ltr"
  data-theme="theme-default"
  data-assets-path="../static/"
  data-template="login"
  data-style="light">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0" />

    <title>Login</title>

    <meta name="description" content="" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="../static/img/favicon/icono-pelota.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&ampdisplay=swap"
      rel="stylesheet" />

    <!-- Icons -->
    <link rel="stylesheet" href="../static/vendor/fonts/remixicon/remixicon.css" />
    <link rel="stylesheet" href=".../static/vendor/fonts/flag-icons.css" />

    <!-- Menu waves for no-customizer fix -->
    <link rel="stylesheet" href="../static/vendor/libs/node-waves/node-waves.css" />

    <!-- Core CSS -->
    <link rel="stylesheet" href="../static/vendor/css/rtl/core.css" class="template-customizer-core-css" />
    <link rel="stylesheet" href="../static/vendor/css/rtl/theme-default.css" class="template-customizer-theme-css" />
    <link rel="stylesheet" href="../static/css/demo.css" />

    <!-- Vendors CSS -->
    <link rel="stylesheet" href="../static/vendor/libs/perfect-scrollbar/perfect-scrollbar.css" />
    <link rel="stylesheet" href="../static/vendor/libs/typeahead-js/typeahead.css" />
    <!-- <link rel="stylesheet" href="../static/vendor/libs/@form-validation/form-validation.css" /> -->
    

    <!-- Page CSS -->
    <!-- Page -->
    <link rel="stylesheet" href="../static/vendor/css/pages/page-auth.css" />

    <!-- Helpers -->
    <script src="../static/vendor/js/helpers.js"></script>
    <!--! Template customizer & Theme config files MUST be included after core stylesheets and helpers.js in the <head> section -->
    <!--? Template customizer: To hide customizer set displayCustomizer value false in config.js.  -->
    <script src="../static/vendor/js/template-customizer.js"></script>
    <!--? Config:  Mandatory theme config file contain global vars & default theme options, Set your preferred theme option in this file.  -->
    <script src="../static/assets/js/config.js"></script>
  </head>

  <body>
    <!-- Content -->

    <div class="authentication-wrapper authentication-cover">

      <div class="authentication-inner row m-0">
        <!-- /Left Section -->
        <div class="d-none d-lg-flex col-lg-7 col-xl-8 align-items-center justify-content-center p-12 pb-2">
          <img
            src="../static/img/Coaches-amico.png"
            class="auth-cover-illustration w-100"
            alt="auth-illustration"
            data-app-light-img="illustrations/auth-login-illustration-light.png"
            data-app-dark-img="illustrations/auth-login-illustration-dark.png" />
          
        </div>
        <!-- /Left Section -->

        <!-- Login -->
        <div
          class="d-flex col-12 col-lg-5 col-xl-4 align-items-center authentication-bg position-relative py-sm-12 px-12 py-6">
          <div class="w-px-400 mx-auto pt-5 pt-lg-0">
            <h4 class="mb-1">Bienvenido! 👋</h4>

            <form id="formAuthentication" class="mb-5" action="{{ url_for('usuarios.login') }}" method="post">
              <div class="form-floating form-floating-outline mb-5">
                <input
                  type="text"
                  class="form-control"
                  id="username"
                  name="username"
                  placeholder="Nombre de usuario"
                  autofocus />
                <label for="username">Nombre de usuario</label>
              </div>
              <div class="mb-5">
                <div class="form-password-toggle">
                  <div class="input-group input-group-merge">
                    <div class="form-floating form-floating-outline">
                      <input
                        type="password"
                        id="password"
                        class="form-control"
                        name="password"
                        placeholder="&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;"
                        aria-describedby="password" />
                      <label for="password">Contraseña</label>
                    </div>
                    <!--<span class="input-group-text cursor-pointer"><i class="ri-eye-off-line"></i></span> -->
                  </div>
                </div>
              </div>
              <div class="mb-5 d-flex justify-content-between mt-5">
                <div class="form-check mt-2">
                  <!-- <input class="form-check-input" type="checkbox" id="remember-me" /> -->
                   <input class="form-check-input" type="checkbox" id="remember-me" name="remember">
                  <label class="form-check-label" for="remember-me"> Recordarme </label>
                </div>
                <a href="/ingresarEmailPass" class="float-end mb-1 mt-2">
                  <span>Olvidaste tu contraseña?</span>
                </a>
              </div>
              
              <button type="submit" class="btn btn-primary d-grid w-100">Ingresar</button>
            </form>

            <div id="alerta-container" style="
                position: fixed;
                bottom: 140px;
                left: 83%;
                transform: translateX(-50%);
                z-index: 1050;  
                width: 90%;
                max-width: 400px;
                text-align: center;">
                {% with mensajes = get_flashed_messages(with_categories=true) %}
                    {% if mensajes %}
                    <div class="container mt-3">
                        {% for categoria, mensaje in mensajes %}
                        <div class="alert alert-{{ categoria }} alert-dismissible fade show" role="alert">
                            {{ mensaje }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                        {% endfor %}
                    </div>
                    {% endif %}
                {% endwith %}
                </div>

           
          </div>
        </div> 
        <!-- /Login -->
      </div>
    </div>

    <!-- / Content -->

    <!-- Core JS -->
    <!-- build:js assets/vendor/js/core.js -->
    <script src="../static/vendor/libs/jquery/jquery.js"></script>
    <script src="../static/vendor/libs/popper/popper.js"></script>
    <script src="../static/vendor/js/bootstrap.js"></script>
    <script src="../static/vendor/libs/node-waves/node-waves.js"></script>
    <script src="../static/vendor/libs/perfect-scrollbar/perfect-scrollbar.js"></script>
    <script src="../static/vendor/libs/hammer/hammer.js"></script>
    <script src="../static/vendor/libs/i18n/i18n.js"></script>
    <script src="../static/vendor/libs/typeahead-js/typeahead.js"></script>
    <script src="../static/vendor/js/menu.js"></script>

    <!-- endbuild -->

    <script src="../static/vendor/libs/@form-validation/popular.js"></script>
    <script src="../static/vendor/libs/@form-validation/bootstrap5.js"></script>
    <script src="../static/vendor/libs/@form-validation/auto-focus.js"></script>

    
    <!-- Main JS -->
    <script src="../static/js/main.js"></script>

    <!-- <script src="../static/js/pages-auth.js"></script> -->
    <script>
  // Cargar los datos almacenados si existen
  window.onload = function() {
    if (localStorage.getItem("remember") === "true") {
      document.getElementById("email").value = localStorage.getItem("email");
      document.getElementById("password").value = localStorage.getItem("password");
      document.getElementById("remember-me").checked = true;
    }
  }

  // Guardar datos si el usuario marca "Recordarme"
  document.getElementById("formAuthentication").addEventListener("submit", function () {
    const rememberMe = document.getElementById("remember-me").checked;
    if (rememberMe) {
      localStorage.setItem("email", document.getElementById("email").value);
      
      localStorage.setItem("remember", "true");
    } else {
      localStorage.removeItem("email");
     
      localStorage.setItem("remember", "false");
    }
  });
</script>

    <script>

      setTimeout(() => {
        $("#alerta-container").each(function() {
        $(this).removeClass('show').addClass('hide');
        setTimeout(() => $(this).remove(), 500);
        });
    }, 2000);

  document.addEventListener('DOMContentLoaded', function () {
    FormValidation.formValidation(
      document.getElementById('formAuthentication'),
      {
        fields: {
          'email-username': {
            validators: {
              notEmpty: {
                message: 'El email es obligatorio'
              },
              emailAddress: {
                message: 'El correo no es válido'
              }
            }
          },
          'password': {
            validators: {
              notEmpty: {
                message: 'La contraseña es obligatoria'
              }
            }
          }
        },
        plugins: {
          trigger: new FormValidation.plugins.Trigger(),
          bootstrap5: new FormValidation.plugins.Bootstrap5({
            rowSelector: '.form-floating',
            eleInvalidClass: '',
            eleValidClass: ''
          }),
          submitButton: new FormValidation.plugins.SubmitButton(),
          defaultSubmit: new FormValidation.plugins.DefaultSubmit(),
          autoFocus: new FormValidation.plugins.AutoFocus()
        }
      }
    );
  });
</script>
  </body>
</html>
