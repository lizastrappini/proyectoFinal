  {% extends "base.html" %}

  {% block content %}

  <div class="content-wrapper">
    <!-- Content -->
    <div class="container-xxl flex-grow-1 container-p-y">
      <!-- Basic Bootstrap Table -->
      <div class="card">
        <h2 class="card-header">Bandeja de Notificaciones</h2>
        <div class="card-body">
  
          <div class="table-responsive text-nowrap overflow-visible">
            <table id="tablaNotificaciones" class="table">
              <thead>
                <tr>
                  <th>Id</th>
                  <th>Título</th>
                  <th>Descripción</th>
                  <th>Categoria</th>
                  <th>Rama</th>
                  <th>División</th>
                  <th>Fecha Envio</th>
                </tr>
              </thead>
            </table>
          </div>
                <!-- Modal -->
                <!-- Agregar User Modal -->
                <div class="modal fade" id="addUser" tabindex="-1" aria-hidden="true">
                  <div class="modal-dialog modal-lg modal-simple modal-edit-user">
                    <div class="modal-content">
                      <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                      <div class="modal-body p-0">

                        <form id="addNotificacionForm" class="row g-5" method="POST" action="{{ url_for('notificacion.nueva_notificacion') }}">
                          <div class="col-12">
                            <div class="form-floating form-floating-outline">
                              <input 
                                type="text"
                                id="titulo"
                                name="titulo"
                                class="form-control"
                                value=""
                                placeholder=""
                                required />
                              <label for="modalEditUserFirstName">Título</label>
                            </div>
                          </div>

                          <div class="col-12">
                            <div class="form-floating form-floating-outline">
                              <select id="categoria" name="categoria" class="form-select">
                                <option value="" disabled selected>Seleccioná una categoría</option>
                                {% for cat in categorias %}
                                  <option value="{{ cat.value }}">{{ cat.text }}</option>
                                {% endfor %}
                              </select>
                              <label for="categoria">Categoría</label>
                            </div>
                          </div>
                          <div class="col-12">
                            <div class="form-floating form-floating-outline">
                              <select id="division" name="division" class="form-select">
                                <option value="" disabled selected>Seleccioná una división</option>
                                {% for div in divisiones %}
                                  <option value="{{ div.value }}">{{ div.text }}</option>
                                {% endfor %}
                              </select>
                              <label for="division">División</label>
                            </div>
                          </div>
                          <div class="col-12">
                            <div class="form-floating form-floating-outline">
                              <select id="rama" name="rama" class="form-select">
                                <option value="" disabled selected>Seleccioná una rama</option>
                                {% for rama in ramas %}
                                  <option value="{{ rama.value }}">{{ rama.text }}</option>
                                {% endfor %}
                              </select>
                              <label for="rama">Rama</label>
                            </div>
                          </div>
                          <div class="col-12">
                            <div class="form-floating form-floating-outline">
                              <textarea
                                id="descripcion"
                                name="descripcion"
                                class="form-control"
                                placeholder="Descripción detallada"
                                style="height: 120px;"  
                                required></textarea>
                              <label for="modalEditUserLastName">Descripción</label>
                            </div>
                          </div>
                         <div class="col-12 text-center d-flex flex-wrap justify-content-center gap-4 row-gap-4">
                            <button type="submit" class="btn btn-primary" id="submitBtn">Crear</button>
                            <button
                              type="reset"
                              class="btn btn-outline-secondary"
                              data-bs-dismiss="modal"
                              aria-label="Close">
                              Cancelar
                            </button>
                          </div>
                        </form>
                      </div>
                    </div>
                  </div>
                </div>
                <!--/ Edit User Modal -->
                <!-- /Modal -->

        </div>
      </div>
    </div>
  </div>

  {% endblock %}

  {% block scripts %}

<script>
  let tabla = null;

  // Inicializar vacía (sin firstLoad)
  tabla = $('#tablaNotificaciones').DataTable({
    ajax: {
      url: '/notificacion/filtrar', // se sobreescribe en filtrar()
      dataSrc: 'data'
    },
    language: {
      emptyTable: '<div class="text-center">No hay notificaciones disponibles</div>'
    },
    columns: [
      { data: 'id' },
      { data: 'titulo' },
      { data: 'descripcion' },
      { data: 'categoria' },
      { data: 'rama' },
      { data: 'division' },
      { data: 'fechaEnvio'}
    ],
    paging: false,
    info: false,
    searching: false,
    ordering: true,
    dom: 'frtip',
    initComplete: function () {
      $('#tablaNotificaciones')
        .removeClass('dataTable no-footer stripe hover')
        .addClass('table');
    }
  });

  // Función de filtrado
  function filtrar() {
    const categoria = $('#categoriaFiltro').val();
    const division = $('#divisionFiltro').val();
    const rama = $('#ramaFiltro').val();
    const buscar = $('#filtroBuscar').val();

    const url = `/notificacion/filtrar?categoria=${encodeURIComponent(categoria || '')}&division=${encodeURIComponent(division || '')}&rama=${encodeURIComponent(rama || '')}&buscar=${encodeURIComponent(buscar || '')}`;

    tabla.ajax.url(url).load(); // ✅ carga la tabla
  }

  // Botón Filtrar
  $('#btnFiltrarNotificacion').on('click', function () {
    filtrar();
  });

  // Limpiar filtros
  function limpiar() {
    $('#categoriaFiltro').val('').trigger('change');
    $('#divisionFiltro').val('').trigger('change');
    $('#ramaFiltro').val('').trigger('change');
    $('#filtroBuscar').val('');
    filtrar(); // 👈 recarga todas las notificaciones
  }

  // Eliminar fila
  function eliminarFila(rowIndex) {
    const data = tabla.row(rowIndex).data();

    Swal.fire({
      title: '¿Estás segura/o?',
      text: `Vas a eliminar la notificación: ${data.titulo}`,
      icon: 'warning',
      showCancelButton: true,
      confirmButtonText: 'Sí, eliminar',
      cancelButtonText: 'Cancelar',
      didOpen: function() {
        document.querySelector('.swal2-container').style.zIndex = 20000;
        document.querySelector('.swal2-popup').style.zIndex = 20001;
      }
    }).then((result) => {
      if (result.isConfirmed) {
        fetch(`/notificacion/eliminar/${data.id}`, {
          method: 'POST',
          headers: { 'X-Requested-With': 'XMLHttpRequest' }
        })
        .then(async r => {
          if (!r.ok) {
            const e = await r.json();
            throw new Error(e.message || 'Error desconocido');
          }
          return r.json();
        })
        .then(data => {
          Swal.fire({
            icon: 'success',
            title: 'Eliminada',
            text: data.message,
            showConfirmButton: false,
            timer: 2000
          });
          tabla.ajax.reload();
        })
        .catch(err => {
          Swal.fire({
            icon: 'error',
            title: 'Error',
            text: err.message || 'Hubo un error al intentar eliminar la notificación.'
          });
        });
      }
    });
  }

  // 👇 carga inicial con todas las notificaciones
  $(document).ready(function () {
    filtrar();
  });
</script>



  <!-- DataTables Buttons CSS -->
  <link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.1/css/buttons.dataTables.min.css"/>

  <!-- DataTables y Buttons JS -->
  <script src="https://cdn.datatables.net/buttons/2.4.1/js/dataTables.buttons.min.js"></script>
  <script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.html5.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  {% endblock %}
