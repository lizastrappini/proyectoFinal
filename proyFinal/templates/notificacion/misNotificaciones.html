  {% extends "base.html" %}

  {% block content %}

  <div class="content-wrapper">
    <!-- Content -->
    <div class="container-xxl flex-grow-1 container-p-y">
      <!-- Basic Bootstrap Table -->
      <div class="card">
        <h2 class="card-header">Bandeja de Notificaciones</h2>
        <div class="card-body">
  
          <div class="table-responsive">
            <table id="tablaNotificaciones" class="table">
              <thead>
                <tr>
                  <th>Id</th>
                  <th>Título</th>
                  <th>Descripción</th>
                  <th>Categoria</th>
                  <th>Rama</th>
                  <th>División</th>
                  <th>Fecha Envio</th>
                </tr>
              </thead>
            </table>
          </div>
           

        </div>
      </div>
    </div>
  </div>

  {% endblock %}

  {% block scripts %}

<script>
  let tabla = null;

  // Inicializar vacía (sin firstLoad)
  tabla = $('#tablaNotificaciones').DataTable({
    ajax: {
      url: '/notificacion/filtrar', // se sobreescribe en filtrar()
      dataSrc: 'data'
    },
    language: {
      emptyTable: '<div class="text-center">No hay notificaciones disponibles</div>'
    },
    columns: [
      { data: 'id' },
      { data: 'titulo' },
      { data: 'descripcion' },
      { data: 'categoria' },
      { data: 'rama' },
      { data: 'division' },
      { data: 'fechaEnvio'}
    ],
    searching: false,
    ordering: true,
    paging: true,
    pageLength: 10,                 // filas por página
    lengthMenu: [10, 25, 50, 100],  // opciones del selector
    info: true,
    pagingType: 'simple_numbers',   // o 'full_numbers' para «primero/último»
    autoWidth: false,
    dom: "frtip",

    language: {
      emptyTable:  '<div class="text-center">No hay notificaciones</div>',
      zeroRecords: '<div class="text-center">No hay notificaciones</div>',
      lengthMenu:  "Mostrar _MENU_",
      info:        "Mostrando _START_ a _END_ de _TOTAL_",
      infoEmpty:   "Mostrando 0 a 0 de 0",
      infoFiltered:"(filtrado de _MAX_ en total)",
      paginate: {
        previous: '<i class="ri-arrow-left-s-line"></i>',
        next:     '<i class="ri-arrow-right-s-line"></i>',
        first:    'Primero',
        last:     'Último'
      }
    },

    initComplete: function () {
      $('#tablaNotificaciones')
        .removeClass('dataTable no-footer stripe hover')
        .addClass('table');
    }
  });

  


 
  // 👇 carga inicial con todas las notificaciones
  $(document).ready(function () {
    filtrar();
  });
</script>



  <!-- DataTables Buttons CSS -->
  <link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.1/css/buttons.dataTables.min.css"/>

  <!-- DataTables y Buttons JS -->
  <script src="https://cdn.datatables.net/buttons/2.4.1/js/dataTables.buttons.min.js"></script>
  <script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.html5.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  {% endblock %}
