
{% extends "base.html" %}

{% block content %}
<div class="container-xxl flex-grow-1 container-p-y">
  <h1>Estadísticas</h1>


<div class="card mt-5">
  <div class="card-body">
    <h5 class="card-title">Selecciona filtros para ver estadísticas</h5>
    <div class="row g-2 align-items-center">
      <div class="row g-2 align-items-center">
  <!-- Fecha -->
  <div class="col-12 col-md-3">
    <div class="form-floating mb-0">
      <input type="text" class="form-control" id="fechaDescargar" placeholder="Fecha de partido" autocomplete="off">
      <label for="fechaDescargar">Fecha</label>
    </div>
  </div>

  <!-- Categoría -->
  <div class="col-12 col-md">
  <div class="form-floating form-floating-outline">
    <select id="categoriaDescargar"
            class="select2 form-select form-select-sm"
            data-placeholder="Categoría"
            data-allow-clear="true"
            style="width:160px; min-height:32px;">
      <option value=""></option>
      {% for cat in categorias %}
        <option value="{{ cat.value }}">{{ cat.text }}</option>
      {% endfor %}
    </select>
  </div>
</div>

  <!-- Rama -->
   <div class="col-12 col-md">
    <div class="form-floating form-floating-outline">
      <select id="ramaDescargar" class="select2 form-select" data-allow-clear="true" data-placeholder="Rama" data-allow-clear="true">
        <option value=""></option>
        {% for r in ramas %}
          <option value="{{ r.value }}">{{ r.text }}</option>
        {% endfor %}
      </select>
    </div>
  </div>

  <!-- División -->
   <div class="col-12 col-md">
    <div class="form-floating form-floating-outline">
      <select id="divisionDescargar" class="select2 form-select" data-allow-clear="true" data-placeholder="División" data-allow-clear="true">
        <option value=""></option>
        {% for d in division %}
          <option value="{{ d.value }}">{{ d.text }}</option>
        {% endfor %}
      </select>
    </div>
  </div>

  <!-- Partido -->
  <div class="col-12 col-md-2">
    <div class="form-floating form-floating-outline">
      <select id="partidoDescargar" class="select2 form-select" data-allow-clear="true" data-placeholder="Partido" data-allow-clear="true">
        <option value=""></option>
        {% for p in partidosDescarga %}
          <option value="{{ p.value }}">{{ p.text }}</option>
        {% endfor %}
      </select>
    </div>
  </div>

  <!-- Contrincante -->
  <div class="col-12 col-md-2">
    <div class="form-floating form-floating-outline">
      <select id="contrincanteDescargar" class="select2 form-select" data-allow-clear="true" data-placeholder="Contrincante">
        <option value=""></option>
        {% for c in contrincantes %}
          <option value="{{ c.value }}">{{ c.text }}</option>
        {% endfor %}
      </select>
    </div>
  </div>

      <!-- Botón -->
      <div class="col-12 col-md-auto">
        <button type="button" class="btn btn-success" id="btnDescargar" style="min-height: 45px !important" disabled>Buscar</button>
      </div>

      <!-- Switch -->
      <div class="mt-3">
        <label class="switch switch-success">
          <input type="checkbox" id="misEstadisticas" class="switch-input">
          <span class="switch-toggle-slider">
            <span class="switch-on"></span>
            <span class="switch-off"></span>
          </span>
          <span class="switch-label"><b>Sólo mis estadísticas</b></span>
        </label>
      </div>
    </div>
  </div>
</div>


  
<br>
<br>
<div class="divestadisticas row g-3 d-none">


  <div class="col-xxl-4 col-md-6 col-sm-12">
    <div class="card h-100">
      <div class="card-header">
        <h5 class="mb-0">Resultados</h5>
      </div>
      <div class="card-body">
        <div id="partidosResultado" style="height:240px;"></div>
      </div>
    </div>
  </div>


  <div class="col-xxl-8 col-md-6 col-sm-12">
    <div class="card h-100">
      <div class="card-header">
        <h5 class="mb-0">Partidos por Categoría</h5>
      </div>
      <div class="card-body">
        <div id="partidosPorCategoria" style="height:240px;"></div>
      </div>
    </div>
  </div>

  

  <div class="col-xxl-4 col-md-4 col-sm-12">
    <div class="card h-100">
      <div class="card-header">
        <h5 class="mb-0">Recepciones</h5>
      </div>
      <div class="card-body" style="margin-top: 6%;">
        <div id="recepcionesPartidos" style="height:240px;"></div>
      </div>
    </div>
  </div>

  
  <div class="col-xxl-8 col-md-6 col-sm-12">
    <div class="card h-100">
      <div class="card-header">
        <h5 class="mb-0">Rotaciones</h5>
      </div>
      <div class="card-body">
        <div id="rotacionesPartidos" style="height:240px;"></div>
      </div>
    </div>
  </div>

<div class="col-xxl-6 col-md-6 col-sm-12">
  <div class="card h-100">
    <div class="card-header">
      <h5 class="mb-0"></h5>
    </div>
    <div class="card-body" style="margin-top: 8%">
      <div class="row">
        <!-- Bloqueos -->
        <div class="col-md-6 col-12 d-flex flex-column align-items-center">
          <h5 class="mb-2">Bloqueos</h5>
          <div id="bloqueosPartidos" style="height:240px; width:100%;"></div>
        </div>

        <!-- Saques -->
        <div class="col-md-6 col-12 d-flex flex-column align-items-center">
          <h5 class="mb-2">Saques</h5>
          <div id="saquesPartidos" style="height:240px; width:100%;"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="col-xxl-6 col-md-6 col-sm-12">
  <div class="card h-100">
    <div class="card-header">
      <h5 class="mb-0">Transiciones</h5>
    </div>
    <div class="card-body">
      <div id="transicionesProgressList" class="row g-4"></div>
    </div>
  </div>
</div>

</div>
</div>

<script src="../static/js/config.js"></script>   
<script src="../static/js/charts-apex.js"></script>
<script src="../static/js/charts-chartjs.js"></script>


<script>
$(document).ready(function() {

  // --- ELEMENTOS ---
  const $btnDescargar = $('#btnDescargar');
  const $categoriaDescargar = $('#categoriaDescargar');
  const $ramaDescargar = $('#ramaDescargar');
  const $divisionDescargar = $('#divisionDescargar');
  const $partidoDescargar = $('#partidoDescargar');
  const $contrincanteDescargar = $('#contrincanteDescargar'); // 👈 agregado
  const $fechaDescargar = $('#fechaDescargar');
  const $misEstadisticas = $('#misEstadisticas');

  // --- INICIALIZAR SELECT2 ---
  $('#categoriaDescargar').select2({
    dropdownParent: $('#categoriaDescargar').parent(),
    width: '160px',
    placeholder: $('#categoriaDescargar').data('placeholder'),
    allowClear: true,
    minimumResultsForSearch: Infinity
  }).val(null).trigger('change');

  $('#ramaDescargar').select2({
    allowClear: true,
    width: '100%',
    placeholder: $('#ramaDescargar').data('placeholder')
  }).val(null).trigger('change');

  $('#divisionDescargar').select2({
    allowClear: true,
    width: '100%',
    placeholder: $('#divisionDescargar').data('placeholder')
  }).val(null).trigger('change');

  $('#partidoDescargar').select2({
    allowClear: true,
    width: '100%',
    placeholder: 'Partido',
    language: { noResults: () => 'No hay partidos' }
  }).val(null).trigger('change');

  $contrincanteDescargar.select2({
    allowClear: true,
    width: '100%',
    placeholder: $contrincanteDescargar.data('placeholder') || 'Contrincante',
    language: { noResults: () => 'Sin resultados' }
  }).val(null).trigger('change');

  // --- EXCLUSIÓN MUTUA Partido vs Contrincante ---
function syncPartidoContrincante() {
  const hayPartido = !!$partidoDescargar.val();
  const hayContra  = !!$contrincanteDescargar.val();

  if (hayPartido) {
    $contrincanteDescargar.val(null).trigger('change.select2');
    $contrincanteDescargar.attr('disabled', true);   // 👈 gris y bloqueado
    $contrincanteDescargar.select2('close');
  } else {
    $contrincanteDescargar.removeAttr('disabled');   // 👈 habilitado otra vez
  }

  if (hayContra) {
    $partidoDescargar.val(null).trigger('change.select2');
    $partidoDescargar.attr('disabled', true);        // 👈 gris y bloqueado
    $partidoDescargar.select2('close');
  } else if (!hayPartido) {
    $partidoDescargar.removeAttr('disabled');        // 👈 habilitado otra vez
  }
}

// Evitar que siquiera se abra el dropdown del otro si ya hay valor
$partidoDescargar.on('select2:opening', function(e){
  if ($contrincanteDescargar.val()) { e.preventDefault(); }
});
$contrincanteDescargar.on('select2:opening', function(e){
  if ($partidoDescargar.val()) { e.preventDefault(); }
});

// Sincronizar al cambiar o limpiar con la X
$partidoDescargar.on('change.select2 select2:clear', syncPartidoContrincante);
$contrincanteDescargar.on('change.select2 select2:clear', syncPartidoContrincante);

// Estado inicial
syncPartidoContrincante();

  // --- INICIALIZAR DATEPICKER ---
  flatpickr("#fechaDescargar", { 
    locale: "es", 
    dateFormat: "d-m-Y",
    maxDate: "today", // no permite seleccionar fechas futuras
    mode: "range"
  });

  // --- HABILITAR BOTÓN SOLO SI HAY FECHA ---
  function verificarDescargar() {
    if($fechaDescargar.val()) {
      $btnDescargar.prop('disabled', false);
    } else {
      $btnDescargar.prop('disabled', true);
    }
  }
  $fechaDescargar.on('change', verificarDescargar);

  // --- CARGAR PARTIDOS SEGÚN FILTROS ---
  function cargarPartidosDescargar() {
    const fecha = $fechaDescargar.val();
    const categoria = $categoriaDescargar.val();
    const rama = $ramaDescargar.val();
    const division = $divisionDescargar.val();

    if(!fecha || !categoria || !rama || !division) {
      $partidoDescargar.empty().append('<option value=""></option>').trigger('change.select2');
      return;
    }

    $.getJSON("/estadisticas/partidos_por_categoria_mostrar", {
      fecha, categoria, rama, division
    }, function(res) {
      $partidoDescargar.empty().append('<option value=""></option>');
      if(res.estado === "ok") {
        res.partidos.forEach(p => {
          $partidoDescargar.append(new Option(p.text, p.value, false, false));
        });
      } else {
        Swal.fire("Error", res.mensaje, "error");
      }
      $partidoDescargar.val(null).trigger('change.select2');
    });
  }

  $categoriaDescargar.add($ramaDescargar).add($divisionDescargar).add($fechaDescargar)
    .on('change', cargarPartidosDescargar);

  // --- CLICK EN BUSCAR: CARGAR GRÁFICOS ---
  $btnDescargar.on('click', function() {
    const data = {
      fecha: $fechaDescargar.val(),
      categoria: $categoriaDescargar.val(),
      rama: $ramaDescargar.val(),
      division: $divisionDescargar.val(),
      partido: $partidoDescargar.val() || '',
      contrincante: $contrincanteDescargar.val() || '',
      misEstadisticas: $misEstadisticas.is(':checked')
    };
    $(".divestadisticas").removeClass('d-none');
    $.getJSON('/estadisticas/datos_graficos', data, function(res) {
      if(res.estado !== 'ok') {
        Swal.fire("Error", res.mensaje, "error");
        return;
      }

      resultadoPartidos(res.partidos);
      partidosPorCategoria(res.partidos);
      bloqueoPartidos(res.partidos);
      renderRecepcionesChart(res.partidos);
      renderRotacionesChart(res.partidos);
      renderTransicionesChart(res.partidos);
      saquesPartidos(res.partidos);
    });
  });
});
const partidosResultadoEl = document.querySelector('#partidosResultado');
const partidosPorCategoriaEl = document.querySelector('#partidosPorCategoria');
const bloqueosEl = document.querySelector('#bloqueosPartidos');
const recepcionesPartidosEl = document.querySelector('#recepcionesPartidos');
const saquesEl = document.querySelector('#saquesPartidos');

function resultadoPartidos(estadisticas) {
  const ganados = estadisticas.partidos_ganados ?? 0;
  const perdidos = estadisticas.partidos_perdidos ?? 0;
  const total = ganados + perdidos;

  const partidosResultadoConfig = {
    chart: {
      height: 240,
      parentHeightOffset: 0,
      type: 'donut'
    },
    labels: ['Ganados', 'Perdidos'],
    series: [ganados, perdidos],
    colors: [config.colors.success, config.colors.danger],
    stroke: {
      width: 5,
      colors: [config.colors.cardColor] // usa el cardColor definido en config.js
    },
    tooltip: {
      y: {
        formatter: function (val) {
          return parseInt(val);
        }
      }
    },
    dataLabels: {
      enabled: false
    },
    states: {
      hover: {
        filter: { type: 'none' }
      },
      active: {
        filter: { type: 'none' }
      }
    },
    legend: {
      show: false
    },
    plotOptions: {
      pie: {
        donut: {
          size: '70%',
          labels: {
            show: true,
            value: {
              fontSize: '1rem',
              fontFamily: 'var(--bs-body-font-family)',
              color: config.colors.headingColor,
              fontWeight: 500,
              offsetY: 4,
              formatter: function (val) {
                return parseInt(val);
              }
            },
            name: {
              show: true
            },
            total: {
              label: 'Total',
              fontFamily: 'var(--bs-body-font-family)',
              show: true,
              fontWeight: 600,
              formatter: function(w) {
                return w.globals.seriesTotals.reduce((a, b) => a + b, 0);
            }

            }
          }
        }
      }
    }
  };

  if (partidosResultadoEl) {
    if (window.partidosResultadoChart) {
      window.partidosResultadoChart.updateOptions({
        series: [ganados, perdidos]
      });
    } else {
      window.partidosResultadoChart = new ApexCharts(partidosResultadoEl, partidosResultadoConfig);
      window.partidosResultadoChart.render();
    }
  }
}

function partidosPorCategoria(estadisticas){
  const seriesData = estadisticas.partidos_por_categoria;
  const categories = estadisticas.categorias;

  const configBar = {
    chart: { type: 'bar', height: 240, toolbar: { show: false } },
    series: [{ name: 'Partidos', data: seriesData }],
    plotOptions: {
      bar: {
        borderRadius: 6,
        barHeight: '40%',
        horizontal: true,
        distributed: true,
        startingShape: 'rounded'
      }
    },
    dataLabels: {
      enabled: false  // <--- quitamos los valores sobre la barra
    },
    tooltip: { enabled: false },
    legend: { show: false },
    colors: [config.colors.primary, config.colors.success, config.colors.warning, config.colors.info, config.colors.danger],
    grid: {
      strokeDashArray: 8,
      borderColor: config.colors.border,
      xaxis: { lines: { show: true } },
      yaxis: { lines: { show: false } },
      padding: { top: -18, left: 21, right: 33, bottom: 10 }
    },
    xaxis: {
      categories: categories,
      tickAmount: Math.max(...seriesData), // <--- fuerza ticks hasta el máximo valor
      labels: {
        formatter: function(val) { return Math.round(val); }, // <--- solo enteros
        style: { fontSize: '13px', colors: config.colors.labelColor, fontFamily: 'var(--bs-body-font-family)' }
      },
      axisBorder: { show: false },
      axisTicks: { show: false }
    },
    yaxis: {
      labels: { style: { fontWeight: 500, fontSize: '0.9375rem', colors: config.colors.headingColor, fontFamily: 'var(--bs-body-font-family)' } }
    },
    states: { hover: { filter: { type: 'none' } }, active: { filter: { type: 'none' } } }
  };

  if(partidosPorCategoriaEl) {
    if(window.partidosPorCategoriaChart) {
      window.partidosPorCategoriaChart.updateOptions({ series: [{ name: 'Partidos', data: seriesData }], xaxis: { categories } });
    } else {
      window.partidosPorCategoriaChart = new ApexCharts(partidosPorCategoriaEl, configBar);
      window.partidosPorCategoriaChart.render();
    }
  }
}

function bloqueoPartidos(estadisticas) {
  const positivos = estadisticas.bloqueos_positivos ?? 0;
  const neutros = estadisticas.bloqueos_neutros ?? 0;
  const total = positivos + neutros;

  const bloqueosEl = document.querySelector('#bloqueosPartidos');
  const series = [positivos, neutros];

  if (window.bloqueosChart) {
    window.bloqueosChart.updateSeries(series);
  } else {
    const configBloqueos = {
      chart: { height: 240, type: 'donut' },
      labels: ['Positivos', 'Neutros'],
      series: series,
      colors: [config.colors.primary, config.colors.info],
      plotOptions: {
        pie: {
          donut: {
            size: '70%',
            labels: {
              show: true,
              value: {
                fontWeight: 600,
                fontFamily: 'var(--bs-body-font-family)',
                formatter: function(val) { return parseInt(val); }
              },
              total: {
                show: true,
                fontSize: '1.2rem',
                color: config.colors.headingColor,
                fontWeight: 600,
                label: 'Total',
                fontFamily: 'var(--bs-body-font-family)',
                formatter: function(w) { return w.globals.seriesTotals.reduce((a, b) => a + b, 0); }
              }
            }
          }
        }
      },
      legend: { show: false },
      dataLabels: { enabled: false }
    };
    window.bloqueosChart = new ApexCharts(bloqueosEl, configBloqueos);
    window.bloqueosChart.render();
  }
}

function renderRecepcionesChart(estadisticas) {
  const seriesData = [
    estadisticas.REE ?? 0,
    estadisticas.REV ?? 0,
    estadisticas.RE1 ?? 0,
    estadisticas.RE2 ?? 0,
    estadisticas.RE3 ?? 0
  ];

  const categories = ['E', 'V', '1', '2', '3'];
  const etiquetasTooltip = ['EJEMPLO LEYENDA', 'REV', 'RE1', 'RE2', 'RE3']; // LEYENDA PARA RECEPCIONES

  const recepcionesChartEl = document.querySelector('#recepcionesPartidos');

  const recepcionesChartConfig = {
    chart: {
      height: 238,
      type: 'bar',
      parentHeightOffset: 0,
      toolbar: { show: false }
    },
    plotOptions: {
      bar: {
        borderRadius: 12,
        distributed: true,
        columnWidth: '50%',
        endingShape: 'rounded',
        startingShape: 'rounded'
      }
    },
    series: [{ data: seriesData }],
    tooltip: {
      enabled: true,
      style: {
        fontSize: '12px'
      },
      onDatasetHover: {
        highlightDataSeries: false
      },
      custom: function ({ dataPointIndex }) {
        const nombre = etiquetasTooltip[dataPointIndex];
        return `<div class="px-3 py-2">
                  <span>${nombre}</span>
                </div>`;
      }
    },
    legend: { show: false },
    dataLabels: {
      enabled: true,
      style: {
        fontSize: '0.9rem',
        fontWeight: 'bold',
        colors: ['#000']
      },
      formatter: function(val) {
        return val;
      },
      offsetY: -6
    },
    colors: [
      config.colors_label.warning,  // REE
      config.colors.warning,        // REV
      config.colors.success,        // RE1
      config.colors.info,           // RE2
      config.colors.danger          // RE3
    ],
    grid: {
      show: false,
      padding: {
        top: -15,
        left: -7,
        right: -4
      }
    },
    states: {
      hover: { filter: { type: 'none' } },
      active: { filter: { type: 'none' } }
    },
    xaxis: {
      axisTicks: { show: false },
      axisBorder: { show: false },
      categories: categories,
      labels: {
        style: {
          colors: config.colors.bodyColor
        }
      }
    },
    yaxis: {
      show: false
    },
    responsive: [
      {
        breakpoint: 1200,
        options: {
          chart: { height: 266 }
        }
      }
    ]
  };

  if (recepcionesChartEl) {
    if (window.recepcionesChart) {
      window.recepcionesChart.updateOptions({
        series: [{ data: seriesData }],
        xaxis: { categories }
      });
    } else {
      window.recepcionesChart = new ApexCharts(recepcionesChartEl, recepcionesChartConfig);
      window.recepcionesChart.render();
    }
  }
}

function renderRotacionesChart(estadisticas) {
  const seriesData = [
    estadisticas.ROE ?? 0,
    estadisticas.ROB ?? 0,
    estadisticas.RO1 ?? 0,
    estadisticas.RO2 ?? 0,
    estadisticas.RO3 ?? 0,
    estadisticas.RO4 ?? 0
  ];

  const etiquetasVisibles = ['E', 'B', '1', '2', '3', '4'];
  const etiquetasTooltip = ['Recepciones vendidas', 'ROB', 'RO1', 'RO2', 'RO3', 'RO4']; //LEYENDA PARA ROTACIONES

  const rotacionesChartEl = document.querySelector('#rotacionesPartidos');

  const rotacionesChartConfig = {
    chart: {
      height: 270,
      type: 'bar',
      toolbar: { show: false }
    },
    plotOptions: {
      bar: {
        horizontal: true,
        distributed: true,
        barHeight: '70%',
        borderRadius: 7
      }
    },
    series: [{
      data: seriesData
    }],
    colors: [
      '#FFD700',
      '#FF69B4',
      '#40E0D0',
      '#FF4500',
      '#8A2BE2',
      '#00BFFF'
    ],
    dataLabels: {
      enabled: true,
      style: {
        colors: ['#000'],
        fontWeight: 500,
        fontSize: '13px',
        fontFamily: 'var(--bs-body-font-family)'
      },
      formatter: function (val) {
        return val;
      },
      offsetX: 0
    },
    tooltip: {
  enabled: true,
  style: {
    fontSize: '12px'
  },
  onDatasetHover: {
    highlightDataSeries: false
  },
  custom: function ({ dataPointIndex }) {
    const nombre = etiquetasTooltip[dataPointIndex];
    return `<div class="px-3 py-2">
              <span>${nombre}</span>
            </div>`;
  }
},

    yaxis: {
      categories: etiquetasVisibles,
      labels: {
        show: true,
        style: {
          colors: config.colors.bodyColor,
          fontFamily: 'var(--bs-body-font-family)',
          fontSize: '13px'
        }
      }
    },
    xaxis: {
      labels: {
        style: {
          colors: config.colors.bodyColor,
          fontSize: '13px',
          fontFamily: 'var(--bs-body-font-family)'
        }
      },
      axisBorder: { show: false },
      axisTicks: { show: false }
    },
    grid: {
      xaxis: { lines: { show: false } },
      yaxis: { lines: { show: false } },
      padding: { top: -15, left: 10, right: 20 }
    },
    legend: { show: false },
     labels: ['E', 'B', '1', '2', '3', '4'], //NOMBRE PARA CADA BARRA EN EL EJE Y
  };

  if (rotacionesChartEl) {
    if (window.rotacionesChart) {
      window.rotacionesChart.updateOptions({
        series: [{ data: seriesData }],
        yaxis: { categories: etiquetasVisibles }
      });
    } else {
      window.rotacionesChart = new ApexCharts(rotacionesChartEl, rotacionesChartConfig);
      window.rotacionesChart.render();
    }
  }
}

function radialBarChart(colorIndex, value, show) {
  const fixedColors = [
    '#7367F0', // primary
    '#28C76F', // success
    '#FF9F43', // warning
    '#00CFE8', // info
    '#EA5455', // danger
    '#82868b', // secondary
    '#343a40'  // dark
  ];

  const color = value > 0 ? fixedColors[colorIndex % fixedColors.length] : '#E9ECEF';

  const radialBarChartOpt = {
    chart: {
      height: show == 'true' ? 58 : 55,
      width: show == 'true' ? 58 : 45,
      type: 'radialBar'
    },
    plotOptions: {
      radialBar: {
        hollow: {
          size: show == 'true' ? '45%' : '25%'
        },
        dataLabels: {
          show: show == 'true',
          value: {
            offsetY: -10,
            fontSize: '15px',
            fontWeight: 500,
            fontFamily: 'var(--bs-body-font-family)',
            color: '#000'  // texto negro
          }
        },
        track: {
          background: '#e9ecef'
        }
      }
    },
    stroke: {
      lineCap: 'round'
    },
    colors: [color],
    grid: {
      padding: {
        top: show == 'true' ? -12 : -15,
        bottom: show == 'true' ? -17 : -15,
        left: show == 'true' ? -17 : -5,
        right: -15
      }
    },
    series: [Number(value)],
    labels: show == 'true' ? [''] : ['']
  };

  return radialBarChartOpt;
}

  const chartProgressList = document.querySelectorAll('.chart-progress');
if (chartProgressList) {
  chartProgressList.forEach(function (chartProgressEl, index) {
    const series = chartProgressEl.dataset.series;
    const variant = chartProgressEl.dataset.progress_variant;
    const options = radialBarChart(index, series, variant); // 👈 usamos el index
    const chart = new ApexCharts(chartProgressEl, options);
    chart.render();
  });
}

function renderTransicionesChart(estadisticas) {
  const transiciones = [
    { key: 'TRE', label: 'EJEMPLO TITULO TRE' }, //LEYENDAS PARA TRANSICIONES
    { key: 'TRB', label: 'EJEMPLO TITULO' },
    { key: 'TR0', label: 'EJEMPLO TITULO' },
    { key: 'TR1', label: 'EJEMPLO TITULO' },
    { key: 'TR2', label: 'EJEMPLO TITULO' },
    { key: 'TR3', label: 'EJEMPLO TITULO' },
    { key: 'TR4', label: 'EJEMPLO TITULO' }
  ];

  const total = estadisticas.TRTOTAL ?? 0; 
  const colors = ['primary', 'success', 'info', 'warning', 'danger', 'secondary', 'dark'];

  const container = document.querySelector('#transicionesProgressList');
  container.innerHTML = ''; 


transiciones.forEach((trans, index) => {
  const valor = estadisticas[trans.key] ?? 0;

  // 👇 Si total es 0, forzamos porcentaje = 0
  const porcentaje = total > 0 ? Math.round((valor / total) * 100) : 0;


  const div = document.createElement('div');

  // 👇 si es el último (index === transiciones.length - 1) -> centrado
  if (index === transiciones.length - 1) {
    div.className = 'col-12 col-md-4 offset-md-4 d-flex justify-content-center';
  } else {
    div.className = 'col-12 col-md-4 d-flex justify-content-center';
  }

  div.innerHTML = `
    <div class="d-flex flex-column align-items-center">
      <div class="chart-progress mb-2"
           data-index="${index}"
           data-series="${porcentaje}"
           data-progress_variant="true"></div>
      <h6 class="mb-1">${trans.label}</h6>
      <p class="mb-0 small">${valor} de ${total}</p>
    </div>
  `;

  container.appendChild(div);
});


// Render Apex radial charts
const chartProgressList = document.querySelectorAll('.chart-progress');
if (chartProgressList) {
  chartProgressList.forEach(function (chartProgressEl) {
    const index = parseInt(chartProgressEl.dataset.index);
    const series = chartProgressEl.dataset.series;
    const variant = chartProgressEl.dataset.progress_variant;
    const options = radialBarChart(index, series, variant); // 👈 ahora sí index
    const chart = new ApexCharts(chartProgressEl, options);
    chart.render();
  });
}
}

function saquesPartidos(estadisticas) {
  const saquesEl = document.querySelector('#saquesPartidos');

  const series = [
    estadisticas.SA0 ?? 0,
    estadisticas.SA1 ?? 0,
    estadisticas.SA2 ?? 0,
    estadisticas.SA3 ?? 0,
    estadisticas.SA4 ?? 0
  ];

  if (window.saquesChart) {
    window.saquesChart.updateSeries(series);
  } else {
    const configSaques = {
      chart: { height: 240, type: 'donut' },
      labels: ['Error (SA0)', 'Malo (SA1)', 'Regular (SA2)', 'Bueno (SA3)', 'Excelente (SA4)'], //LEYENDAS PARA SAQUES
      series: series,
      colors: [
          '#FFD700', // amarillo
          '#FF69B4', // rosa
          '#40E0D0', // turquesa
          '#FF4500', // naranja/rojo
          '#8A2BE2'  // violeta
        ],
      plotOptions: {
        pie: {
          donut: {
            size: '70%',
            labels: {
              show: true,
              value: {
                fontWeight: 600,
                fontFamily: 'var(--bs-body-font-family)',
                formatter: function(val) { return parseInt(val); }
              },
              total: {
                show: true,
                fontSize: '1.2rem',
                color: config.colors.headingColor,
                fontWeight: 600,
                label: 'Total',
                fontFamily: 'var(--bs-body-font-family)',
                formatter: function(w) {
                  return w.globals.seriesTotals.reduce((a, b) => a + b, 0);
                }
              }
            }
          }
        }
      },
      legend: { show: false },
      dataLabels: { enabled: false }
    };
    window.saquesChart = new ApexCharts(saquesEl, configSaques);
    window.saquesChart.render();
  }
}
