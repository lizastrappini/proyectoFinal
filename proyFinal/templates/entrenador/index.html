{% extends "base.html" %}
{% block title %}Entrenadores{% endblock %}
{% block content %}

<div class="content-wrapper">
  <!-- Content -->
  <div class="container-xxl flex-grow-1 container-p-y">
    <!-- Basic Bootstrap Table -->
    <div class="card">
      <h2 class="card-header">Entrenadores</h2>
      <div class="card-body">
        <div class="d-flex justify-content-end align-items-center gap-2 mb-4">
          <!-- <div class="form-floating form-floating-outline" style="min-width: 180px;"> 
            <select id="categoriaFiltro"
                    class="select2 form-select" 
                    data-allow-clear="true"
                    data-placeholder="Categoría">
              <option value=""></option>
              {% for cat in categorias %}
                <option value="{{ cat.value }}">{{ cat.text }}</option>
              {% endfor %}
            </select>
          </div> -->
          <div class="form-floating form-floating-outline" style="min-width: 200px;">
                <input type="text" id="filtroBuscar" class="form-control" placeholder="Buscar...">
                <label for="filtroBuscar">Buscar</label>
              </div>


          <button id="btnFiltrarEntrenador" class="btn btn-primary waves-effect waves-light" style="height:47px;">
            Filtrar
          </button>
        </div>
      
        <div class="d-flex justify-content-end align-items-center gap-3 mb-5">
          <button class="btn btn-secondary buttons-collection btn-label-primary waves-effect waves-light btn-export" style="padding:10px;font-size:small;" type="button">
              <i class="ri-upload-line me-sm-1"></i> Exportar
            </button>
          <a href="javascript:;" class="btn btn-primary" data-bs-target="#addUser" data-bs-toggle="modal">
            Agregar
          </a>
        </div>
        <div class="table-responsive text-nowrap overflow-visible">
          <table id="tablaEntrenador" class="table">
            <thead>
              <tr>
                <th>DNI</th>
                <th>Nombre</th>
                <th>Apellido</th>
                <th>Email</th> 
                <th>Teléfono</th> 
                <th>Categoría</th> 
                <th>División</th> 
                <th>Rama</th> 
                <th>Estado</th> 
                <th>Acciones</th>
              </tr>
            </thead>
          </table>
        </div>
              <!-- Modal -->
              <!-- Agregar User Modal -->
              <div class="modal fade" id="addUser" tabindex="-1" aria-hidden="true">
                <div class="modal-dialog modal-lg modal-simple modal-edit-user">
                  <div class="modal-content">
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    <div class="modal-body p-0">
                      <div class="text-center mb-6">
                        <h4 class="mb-2" id="tituloAdd">Agregar Entrenador</h4>
                        <div id="formError" class="alert alert-danger mx-4 d-none" role="alert"></div>
                      </div>
                      
                      <form id="editEntrenadorForm" class="row g-5" method="POST" action="{{ url_for('entrenador.agregar_entrenador') }}">
                        <div class="col-12 col-md-6">
                          <div class="form-floating form-floating-outline">
                            <input 
                              type="int"
                              id="dni"
                              name="dni"
                              class="form-control"
                              value=""
                              placeholder=""
                              required />
                            <label for="modalEditUserFirstName">DNI</label>
                          </div>
                        </div>
                        <div class="col-12 col-md-6">
                          <div class="form-floating form-floating-outline">
                            <input 
                              type="text"
                              id="nombre"
                              name="nombre"
                              class="form-control"
                              value=""
                              placeholder=""
                              required />
                            <label for="modalEditUserFirstName">Nombre</label>
                          </div>
                        </div>

                        <div class="col-12 col-md-6">
                          <div class="form-floating form-floating-outline">
                            <input
                              type="text"
                              id="apellido"
                              name="apellido"
                              class="form-control"
                              value=""
                              placeholder=""
                              required />
                            <label for="modalEditUserLastName">Apellido</label>
                          </div>
                        </div>
                        <div class="col-12 col-md-6">
                          <div class="form-floating form-floating-outline">
                            <input
                              type="text"
                              id="email"
                              name="email"
                              class="form-control"
                              value=""
                              placeholder=""
                              required />
                            <label for="modalEditUserLastName">Email</label>
                          </div>
                        </div>
                        <div class="col-12 col-md-6">
                          <div class="form-floating form-floating-outline">
                            <input
                              type="text"
                              id="telefono"
                              name="telefono"
                              class="form-control"
                              value=""
                              placeholder="" 
                              />
                            <label for="modalEditUserLastName">Teléfono</label>
                          </div>
                        </div>
                     
                       
                     <div class="col-12 col-md-6">
                            <div class="form-floating form-floating-outline form-floating-select2" data-select2-id="1">
                            <label for="categoria" class="form-label">Categoría</label>
                            <select class="form-select" id="categoria" name="categoria"  required>
                              <option value="">Seleccione una categoria</option>
                              {% for categoria in categorias %}
                                <option value="{{ categoria.text }}">{{ categoria.text }}</option>
                              {% endfor %}
                            </select>
                          </div>
                          </div>
                           <div class="col-12 col-md-6">
                            <div class="form-floating form-floating-outline form-floating-select2" data-select2-id="2">
                            <label for="division" class="form-label">División</label>
                            <select class="form-select" id="division" name="division" >
                              <option value="">Seleccione una división</option>
                              {% for division in divisiones %}
                                <option value="{{ division.text }}">{{ division.text }}</option>
                              {% endfor %}
                            </select>
                          </div>
                          </div>
                          <div class="col-12 col-md-6">
                            <div class="form-floating form-floating-outline form-floating-select2" data-select2-id="3">
                            <label for="rama" class="form-label">Rama</label>
                            <select class="form-select" id="rama" name="rama" >
                              <option value="">Seleccione una rama</option>
                              {% for rama in ramas %}
                                <option value="{{ rama.text }}">{{ rama.text }}</option>
                              {% endfor %}
                            </select>
                          </div>
                          </div>
                           

                        

                          <div class="col-12 col-md-6">
                            <div class="form-floating form-floating-outline form-floating-select2" data-select2-id="4">
                            <label for="categoriaExtra" class="form-label">Categoría Extra</label>
                            <select class="select2 form-select" id="categoriaExtra" name="categoriaExtra" data-placeholder="Categoria Extra" multiple="multiple">
                              <option value="">Seleccione una categoria</option>
                              {% for cat in categorias %}
                                <option value="{{ cat.text }}">{{ cat.text }}</option>
                              {% endfor %}
                            </select>
                          </div>
                          </div>
                        
                        
                        <div class="col-12 text-center d-flex flex-wrap justify-content-center gap-4 row-gap-4">
                          <button type="submit" class="btn btn-primary" id="submitBtn">Crear</button>
                          <button
                            type="reset"
                            class="btn btn-outline-secondary"
                            data-bs-dismiss="modal"
                            aria-label="Close">
                            Cancelar
                          </button>
                        </div>
                      </form>
                    </div>
                  </div>
                </div>
              </div>
              <!--/ Edit User Modal -->
              <!-- /Modal -->
        
      </div>
    </div>
  </div>
</div>

{% endblock %}

{% block scripts %}
<script>
  let tabla = null;
  let firstLoad = true; // fuerza la primera carga vacía
$(document).ready(function () {
  // Inicializar la tabla una sola vez (vacía en el primer draw)
  tabla = $('#tablaEntrenador').DataTable({
    ajax: {
      url: '/entrenador/filtrar?init=1', // tu endpoint inicial
      dataSrc: function (json) {
        if (firstLoad) { firstLoad = false; return []; } // ✅ vacía en el arranque
        return json && json.data ? json.data : [];
      }
    },
    columns: [
      { data: 'dni' },
      { data: 'nombre' },
      { data: 'apellido' },
      { data: 'email' },
      { data: 'telefono' },
      { data: 'categoria' },
      { data: 'division' },
      { data: 'rama' },
      {
        data: 'estado',
        render: function (data) {
          const badgeClass = data === 'Activo' ? 'bg-label-success' : 'bg-label-danger';
          return `<span class="badge rounded-pill ${badgeClass}">${data}</span>`;
        }
      },
      {
        data: null,
        orderable: false,
        searchable: false,
        render: function (data, type, row, meta) {
          const accion = row.estado === 'Activo' ? 'Deshabilitar' : 'Habilitar';
          return `
            <div class="dropdown" data-bs-boundary="viewport">
              <button type="button" class="btn p-0 dropdown-toggle hide-arrow" data-bs-toggle="dropdown">
                <i class="ri-more-2-line"></i>
              </button>
              <div class="dropdown-menu">
                <a class="dropdown-item" href="javascript:void(0);" onclick="editarFila(${meta.row})">
                  <i class="ri-pencil-line me-1"></i> Editar
                </a>
                <a class="dropdown-item" href="javascript:void(0);" onclick="eliminarFila(${meta.row})">
                  <i class="ri-delete-bin-7-line me-1"></i> Eliminar
                </a>
                <a class="dropdown-item cambiar-estado" href="javascript:void(0);" data-dni="${row.dni || ''}">
                  <i class="ri-refresh-line me-1"></i> ${accion}
                </a>
              </div>
            </div>
          `;
        }
      }
    ],
    paging: false,
    info: false,
    searching: false,
    ordering: true,
    dom: 'frtip',
    autoWidth: false,  
    buttons: [
      {
        extend: 'excelHtml5',
        text: 'Exportar a Excel',
        title: 'Entrenadores',
        className: 'buttons-excel',
        exportOptions: { columns: ':not(:last-child)' }
      }
    ],
     paging: true,
  pageLength: 10,                 // filas por página
  lengthMenu: [10, 25, 50, 100],  // opciones del selector
  info: true,
  pagingType: 'simple_numbers',   // o 'full_numbers' para «primero/último»
  autoWidth: false,
  dom: "frtip",

  language: {
    emptyTable:  '<div class="text-center">Ningún dato disponible. Intente filtrar</div>',
    zeroRecords: '<div class="text-center">Ningún dato disponible. Intente filtrar</div>',
    lengthMenu:  "Mostrar _MENU_",
    info:        "Mostrando _START_ a _END_ de _TOTAL_",
    infoEmpty:   "Mostrando 0 a 0 de 0",
    infoFiltered:"(filtrado de _MAX_ en total)",
    paginate: {
      previous: '<i class="ri-arrow-left-s-line"></i>',
      next:     '<i class="ri-arrow-right-s-line"></i>',
      first:    'Primero',
      last:     'Último'
    }
  },
    initComplete: function () {
      $('#tablaEntrenador').removeClass('dataTable no-footer stripe hover').addClass('table');
    }
  });});

$('.btn-export').on('click', function () {
  const cantidadFilas = tabla.rows({ search: 'applied' }).count();

  if (cantidadFilas === 0) {
    Swal.fire('Atención', 'No hay datos para exportar.', 'warning');
    return;
  }

  tabla.button('.buttons-excel').trigger();
});

  // Botón Filtrar (ID correcto del botón en tu HTML)
  $('#btnFiltrarEntrenador').on('click', function () {
    filtrar();
  });

  // Función de filtrado
  function filtrar() {
    
    const buscar = $('#filtroBuscar').val();
    
    const url = `/entrenador/filtrar?buscar=${encodeURIComponent(buscar || '')}`;
    tabla.ajax.url(url).load(); // ✅ recarga sobre la tabla ya creada
  }

  // Editar fila
  function editarFila(rowIndex) {
  const tabla = $('#tablaEntrenador').DataTable();
  const data = tabla.row(rowIndex).data();
  const dni = data.dni;

  fetch(`/entrenador/getEntrenador/${dni}`, {
    headers: { 'X-Requested-With': 'XMLHttpRequest' }
  })
    .then(async r => {
      if (!r.ok) {
        const e = await r.json();
        throw new Error(e.message || 'Error al cargar datos del entrenador');
      }
      return r.json();
    })
    .then(detalle => {
      $('#dni').val(detalle.dni);
      $('#nombre').val(detalle.nombre);
      $('#apellido').val(detalle.apellido);
      $('#email').val(detalle.email);
      $('#telefono').val(detalle.telefono);
      $('#categoria').val(detalle.categoria).trigger('change');
      $('#rama').val(detalle.rama).trigger('change');
      $('#division').val(detalle.division).trigger('change');
      


      if (detalle.categoriaExtra) {
        const extras = Array.isArray(detalle.categoriaExtra)
          ? detalle.categoriaExtra
          : detalle.categoriaExtra.split(',');
        $('#categoriaExtra').val(extras).trigger('change');
      } else {
        $('#categoriaExtra').val(null).trigger('change');
      }

      $('#editEntrenadorForm').attr('action', `/entrenador/editar/${detalle.dni}`);
      $('#submitBtn').text('Actualizar');
      $('#tituloAdd').text('Editar Entrenador');
      $('#addUser').modal('show');
    })
    .catch(err => {
      Swal.fire({ icon: 'error', title: 'Error', text: err.message || 'No se pudo cargar el entrenador' });
    });
}


  // Reset modal
  $('#addUser').on('hidden.bs.modal', function () {
    const errorDiv = document.getElementById('formError');
    errorDiv.classList.add('d-none');
    errorDiv.textContent = '';
    $('#editEntrenadorForm')[0].reset();
    $('#categoria, #categoriaExtra, #rama, #division').val(null).trigger('change');
    $('#editEntrenadorForm').attr('action', '{{ url_for("entrenador.agregar_entrenador") }}');
    $('#submitBtn').text('Crear');
    $('#tituloAdd').text('Agregar Entrenador');
  });

  // Guardar (crear/editar)
  $('#editEntrenadorForm').on('submit', function(e) {
    e.preventDefault();

    const form = this;
    const actionUrl = $(form).attr('action');
    const formData = new FormData(form);

    fetch(actionUrl, {
      method: 'POST',
      body: formData,
      headers: { 'X-Requested-With': 'XMLHttpRequest' }
    })
    .then(async r => { if (!r.ok) { const e = await r.json(); throw new Error(e.message || 'Error al actualizar'); } return r.json(); })
    .then(data => {
      Swal.fire({ icon: 'success', title: data.message.includes('creado') ? 'Entrenador creado' : 'Entrenador actualizado', text: data.message, showConfirmButton: false, timer: 2000 });
      $('#addUser').modal('hide');
      $('#editEntrenadorForm')[0].reset();
      $('#categoria,#categoriaExtra,#rama, #division').val(null).trigger('change');
      $('#editEntrenadorForm').attr('action', '{{ url_for("entrenador.agregar_entrenador") }}');
      $('#submitBtn').text('Crear');
      $('#tituloAdd').text('Agregar Entrenador');
      if (tabla) tabla.ajax.reload();
    })
    .catch(err => {
      const errorDiv = document.getElementById('formError');
      errorDiv.textContent = err.message;
      errorDiv.classList.remove('d-none');
    });
  });

  // Eliminar fila
  function eliminarFila(rowIndex) {
    const tabla = $('#tablaEntrenador').DataTable();
    const data = tabla.row(rowIndex).data();

    Swal.fire({
      title: '¿Estás segura/o?',
      text: `Vas a eliminar a ${data.nombre} ${data.apellido}`,
      icon: 'warning',
      showCancelButton: true,
      confirmButtonText: 'Sí, eliminar',
      cancelButtonText: 'Cancelar'
    }).then((result) => {
      if (result.isConfirmed) {
        fetch(`/entrenador/eliminar/${data.dni}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'XMLHttpRequest' }
        })
        .then(async r => { if (!r.ok) { const e = await r.json(); throw new Error(e.message || 'Error desconocido'); } return r.json(); })
        .then(data => {
          Swal.fire({ icon: 'success', title: 'Eliminado', text: data.message, showConfirmButton: false, timer: 2000 });
          tabla.ajax.reload();
        })
        .catch(err => {
          Swal.fire({ icon: 'error', title: 'Error', text: err.message || 'Hubo un error al intentar eliminar el entrenador.' });
        });
      }
    });
  }

  // Limpiar filtros
  function limpiar() {
    $('#filtroBuscar').val('').trigger('change');

    filtrar(); // recarga sin filtros
  }

  // Cambiar estado
  $('#tablaEntrenador').on('click', '.cambiar-estado', function () {
    const dni = $(this).data('dni');

    fetch(`/entrenador/cambiarEstado/${dni}`, {
      method: 'POST',
      headers: { 'X-Requested-With': 'XMLHttpRequest' }
    })
    .then(async r => { if (!r.ok) { const e = await r.json(); throw new Error(e.message || 'Error desconocido'); } return r.json(); })
    .then(data => {
      Swal.fire({ icon: 'success', title: 'Estado actualizado', text: `Nuevo estado: ${data.nuevo_estado}`, timer: 2000, showConfirmButton: false });
      tabla.ajax.reload(null, false);
    })
    .catch(err => {
      Swal.fire({ icon: 'error', title: 'Error al cambiar estado', text: err.message || 'Ocurrió un error inesperado' });
    });
  });
</script>


<!-- DataTables Buttons CSS -->
<link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.1/css/buttons.dataTables.min.css"/>

<!-- DataTables y Buttons JS -->
<script src="https://cdn.datatables.net/buttons/2.4.1/js/dataTables.buttons.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.html5.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

{% endblock %}
