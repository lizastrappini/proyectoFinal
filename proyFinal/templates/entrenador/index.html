{% extends "base.html" %}

{% block content %}

<div class="content-wrapper">
  <!-- Content -->
  <div class="container-xxl flex-grow-1 container-p-y">
    <!-- Basic Bootstrap Table -->
    <div class="card">
      <h2 class="card-header">Entrenadores</h2>
      <div class="card-body">

          </div>
          <div class="col-12 col-md-3">
            <select id="categoria" class="select2 form-select" data-placeholder="Categoria">

          </div>

        <div class="d-flex justify-content-end align-items-center gap-3 mb-5">

              <div class="mb-4 w-100">

                  </span>

                </div>
              </div>
            </div>
          </div>

          <button class="btn btn-secondary buttons-collection btn-label-primary waves-effect waves-light" type="button">
            <span><i class="ri-external-link-line me-sm-1"></i>

            </span>
          </button>

          <a href="javascript:;" class="btn btn-primary" data-bs-target="#editUser" data-bs-toggle="modal">
            Agregar

        </div>

        <div class="table-responsive text-nowrap">
          <table id="tablaDeportistas" class="table">

        </div>

                                <option value="sub16" data-select2-id="143">Sub 16</option>
                                <option value="sub18" data-select2-id="144">Sub 18</option>
                                <option value="sub21" data-select2-id="145">Sub 21</option>
                                <option value="primera" data-select2-id="146">Primera</option>
                            </select>
                            </div>
                            <label for="select2Multiple">Categorias</label>
                          </div>
                        </div>

                       <!-- <div class="col-12 col-md-6">
                          <div class="form-floating form-floating-outline">
                            <select
                              id="modalEditUserCountry"
                              name="modalEditUserCountry"
                              class="select2 form-select"
                              data-allow-clear="true">
                              <option value="">Selecciona Categoria</option>
                              <option value="sub12">Sub 12</option>
                              <option value="sub13">Sub 13</option>
                              <option value="sub14">Sub 14</option>
                              <option value="sub16">Sub 16</option>

                            <label for="modalEditUserCountry">Categoría</label>

                        </div>--> 
                        
                        
                          <div class="col-12 col-md-6">
                            <div class="form-floating form-floating-outline mb-6">
                              <input class="form-control" type="date" id="html5-date-input">
                              <label for="html5-date-input">Fecha Ingreso</label>
                            </div>
                             </div>                       
                        <div class="col-12 text-center d-flex flex-wrap justify-content-center gap-4 row-gap-4">
                          <button type="submit" class="btn btn-primary">Crear</button>
                          <button
                            type="reset"
                            class="btn btn-outline-secondary"
                            data-bs-dismiss="modal"
                            aria-label="Close">
                            Cancelar
                          </button>
                        </div>
                      </form>
                    </div>
                  </div>
                </div>
              </div>
              <!--/ Edit User Modal -->
              <!-- /Modal -->
        
      </div>
    </div>
  </div>
</div>

{% endblock %}

{% block scripts %}
<script>
  let tabla = null;

  function filtrar() {
    const categoria = $('#categoria').val();
    console.log("Categoría seleccionada:", categoria);
    if (tabla) {
      tabla.ajax.url(`/entrenador/filtrar?categoria=${categoria}`).load();
    } else {
      tabla = $('#tablaDeportistas').DataTable({
        ajax: {
          url: `/entrenador/filtrar?categoria=${categoria}`,
          dataSrc: 'data'
        },
        columns: [
        { data: 'nombre' },
        { data: 'apellido' },
        { data: 'categoria' },
        { data: 'fecha_ingreso' },
        {
          data: null,
          orderable: false,
          searchable: false,
          render: function(data, type, row, meta) {
            return `
              <div class="dropdown">
                <button type="button" class="btn p-0 dropdown-toggle hide-arrow" data-bs-toggle="dropdown" aria-expanded="false">
                  <i class="ri-more-2-line"></i>
                </button>
                <div class="dropdown-menu">
                  <a class="dropdown-item" href="javascript:void(0);" onclick="editarFila(${meta.row})">
                    <i class="ri-pencil-line me-1"></i> Edit
                  </a>
                  <a class="dropdown-item" href="javascript:void(0);" onclick="eliminarFila(${meta.row})">
                    <i class="ri-delete-bin-7-line me-1"></i> Delete
                  </a>
                </div>
              </div>
            `;
          }
        }
        ],
        paging: false,
        info: false,
        searching: false,
        ordering: true,
        drawCallback: function () {
          // Reaplicá estilos de tu template si hace falta
        },
        initComplete: function () {
          $('#tablaDeportistas')
            .removeClass('dataTable no-footer stripe hover')
            .addClass('table');
        }
      });
    }
  }
    
  $(document).ready(function() {
    filtrar();

    
  });

    function editarFila(rowIndex) {
    var tabla = $('#tabla-entrenadores').DataTable();
    var data = tabla.row(rowIndex).data();
    alert('Editar a ' + data[0] + ' ' + data[1]);
    // Abrí modal, redirigí, etc.
    }

    function eliminarFila(rowIndex) {
      var tabla = $('#tabla-entrenadores').DataTable();
      var data = tabla.row(rowIndex).data();
      if (confirm('Eliminar a ' + data[0] + ' ' + data[1] + '?')) {
        // Lógica para eliminar (AJAX, etc.)
        alert('Eliminado: ' + data[0]);
      }
    }


</script>
{% endblock %}
