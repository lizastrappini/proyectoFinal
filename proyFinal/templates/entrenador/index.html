{% extends "base.html" %}

{% block content %}

<div class="content-wrapper">
  <!-- Content -->
  <div class="container-xxl flex-grow-1 container-p-y">
    <!-- Basic Bootstrap Table -->
    <div class="card">
      <h2 class="card-header">Entrenadores</h2>
      <div class="card-body">

        
        <div class="d-flex row mb-5 gx-5">
          <div class="col d-flex justify-content-end">
            <button class="btn btn-secondary btn-label-primary btn-lg waves-effect waves-light" onclick="filtrar()">
              Filtrar
            </button>
          </div>
          <div class="col-12 col-md-3">
            <select id="categoria" class="select2 form-select" data-placeholder="Categoria">
              <option value=""></option>
              {% for cat in categorias %}
                  <option value="{{ cat.value }}">{{ cat.text }}</option>
              {% endfor %}
            </select>
          </div>
          
        </div>
      
        <div class="d-flex justify-content-end align-items-center gap-3 mb-5">
          <div class="d-flex justify-content-between align-items-center px-3 mt-5">
            <div class="d-flex align-items-center w-100">
              <i class="ri-menu-line ri-24px cursor-pointer d-block d-lg-none me-4 mb-5" data-bs-toggle="search"></i>
              <div class="mb-4 w-100">
                <div class="input-group input-group-merge shadow-none">
                  <span class="input-group-text border-6 ps-1 py-1" id="players-search">
                    <i class="ri-search-line ri-22px"></i>
                  </span>
                  <input type="text" class="form-control search-input border-6 py-1" placeholder="Buscar Entrenador" aria-label="Buscar deportistas" aria-describedby="players-search">
                </div>
              </div>
            </div>
          </div>

          <button class="btn btn-secondary buttons-collection btn-label-primary waves-effect waves-light" type="button">
            <span><i class="ri-external-link-line me-sm-1"></i> 
              <span class="d-none d-sm-inline-block">Exportar</span>
            </span>
          </button>

          <a href="javascript:;" class="btn btn-primary" data-bs-target="#addUser" data-bs-toggle="modal">
            Agregar
          </a>
        </div>
        <div class="table-responsive text-nowrap">
          <table id="tablaEntrenador" class="table">
            <thead>
              <tr>
                <th>DNI</th>
                <th>Nombre</th>
                <th>Apellido</th> 
                <th>Categorías</th>                        
                <th>Acciones</th>
              </tr>
            </thead>
          </table>
        </div>
              <!-- Modal -->
              <!-- Agregar User Modal -->

              
              <div class="modal fade" id="addUser" tabindex="-1" aria-hidden="true">
                <div class="modal-dialog modal-lg modal-simple modal-edit-user">
                  <div class="modal-content">
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    <div class="modal-body p-0">
                      <div class="text-center mb-6">
                        <h4 class="mb-2" id="tituloAdd">Agregar Entrenador</h4>
                        
                      </div>
                      <form id="editEntrenadorForm" class="row g-5" action="{{ url_for('entrenador.add_entrenador') }}" method="post">
                        <div class="col-12 col-md-6">
                          <div class="form-floating form-floating-outline">
                            <input 
                              type="int"
                              id="modalEditUserDNI"
                              name="modalEditUserDNI"
                              class="form-control"
                              value=""
                              placeholder="" />
                            <label for="modalEditUserFirstName">DNI</label>
                          </div>
                        </div>
                        <div class="col-12 col-md-6">
                          <div class="form-floating form-floating-outline">
                            <input 
                              type="text"
                              id="modalEditUserFirstName"
                              name="modalEditUserFirstName"
                              class="form-control"
                              value=""
                              placeholder="" />
                            <label for="modalEditUserFirstName">Nombre</label>
                          </div>
                        </div>

                        <div class="col-12 col-md-6">
                          <div class="form-floating form-floating-outline">
                            <input
                              type="text"
                              id="modalEditUserLastName"
                              name="modalEditUserLastName"
                              class="form-control"
                              value=""
                              placeholder="" />
                            <label for="modalEditUserLastName">Apellido</label>
                          </div>
                        </div>
                    <div class="col-12 col-md-6">
                        <div class="form-floating form-floating-outline form-floating-select2" data-select2-id="137">
                            <div class="position-relative" data-select2-id="136">
                                <select id="select2Multiple" 
                                class="select2 form-select select2-hidden-accessible" multiple="" 
                                data-select2-id="select2Multiple" tabindex="-1" aria-hidden="true">
                              
                                  <option value=""></option>
                                  {% for cat in categorias %}
                                      <option value="{{ cat.value }}">{{ cat.text }}</option>
                                  {% endfor %}
                            </select>
                            </div>
                            <label for="select2Multiple">Categorias</label>
                          </div>
                        </div>                       
                        <div class="col-12 text-center d-flex flex-wrap justify-content-center gap-4 row-gap-4">
                          <button type="submit" class="btn btn-primary" id="submitBtn">Crear</button>
                          <button
                            type="reset"
                            class="btn btn-outline-secondary"
                            data-bs-dismiss="modal"
                            aria-label="Close">
                            Cancelar
                          </button>
                        </div>
                      </form>
                    </div>
                  </div>
                </div>
              </div>
              <!--/ Edit User Modal -->
              <!-- /Modal -->
        
      </div>
    </div>
  </div>
</div>

{% endblock %}

{% block scripts %}
<script>
  let tabla = null;

  function filtrar() {
    const categoriaRaw = $('#categoria').val();
    const categoria = categoriaRaw ? categoriaRaw.toUpperCase() : '';
    console.log("Categoría seleccionada:", categoria);
    if (tabla) {
      tabla.ajax.url(`/entrenador/filtrar?categoria=${categoria}`).load();
    } else {
      tabla = $('#tablaEntrenador').DataTable({
        ajax: {
          url: `/entrenador/filtrar?categoria=${categoria}`,
          dataSrc: 'data'
        },
        columns: [
        { data: 'dni' },
        { data: 'nombre' },
        { data: 'apellido' },
        { data: 'categoria' },
        {
          data: null,
          orderable: false,
          searchable: false,
          render: function(data, type, row, meta) {
            return `
              <div class="dropdown">
                <button type="button" class="btn p-0 dropdown-toggle hide-arrow" data-bs-toggle="dropdown" aria-expanded="false">
                  <i class="ri-more-2-line"></i>
                </button>
                <div class="dropdown-menu">
                  <a class="dropdown-item" href="javascript:void(0);" onclick="editarFila(${meta.row})">
                    <i class="ri-pencil-line me-1"></i> Editar
                  </a>
                  <a class="dropdown-item" href="javascript:void(0);" onclick="eliminarFila(${meta.row})">
                    <i class="ri-delete-bin-7-line me-1"></i> Eliminar
                  </a>
                </div>
              </div>
            `;
          }
        }
        ],
        paging: false,
        info: false,
        searching: false,
        ordering: true,
        drawCallback: function () {
          // Reaplicá estilos de tu template si hace falta
        },
        initComplete: function () {
          $('#tablaEntrenador')
            .removeClass('dataTable no-footer stripe hover')
            .addClass('table');
        }
      }); 
    }
  }
    
  $(document).ready(function() {
    filtrar();

    
  });

            function editarFila(rowIndex) {
            const tabla = $('#tablaEntrenador').DataTable();
            const data = tabla.row(rowIndex).data();

            // Llenar inputs
            $('#modalEditUserDNI').val(data.dni);
            $('#modalEditUserFirstName').val(data.nombre);
            $('#modalEditUserLastName').val(data.apellido);

            $('#select2Multiple').val([data.idCategoria]).trigger('change');

             $('#submitBtn').text('Actualizar');
             $('#tituloAdd').text('Editar Entrenador');

            // Mostrar el modal
            $('#addUser').modal('show');
          }


    function eliminarFila(rowIndex) {
      var tabla = $('#tablaEntrenador').DataTable();
      var data = tabla.row(rowIndex).data();
      if (confirm('Eliminar a ' + data[0] + ' ' + data[1] + '?')) {
        // Lógica para eliminar (AJAX, etc.)
        alert('Eliminado: ' + data[0]);
      }
    }

        $('#addUser').on('hidden.bs.modal', function () {
        $('#submitBtn').text('Crear');
        $('#tituloAdd').text('Agregar Entrenador');
        $('#editEntrenadorForm')[0].reset();
        $('#select2Multiple').val(null).trigger('change');
      });


</script>
{% endblock %}
