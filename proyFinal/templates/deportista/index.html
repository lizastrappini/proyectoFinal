  {% extends "base.html" %}

  {% block content %}

  <div class="content-wrapper">
    <!-- Content -->
    <div class="container-xxl flex-grow-1 container-p-y">
      <!-- Basic Bootstrap Table -->
      <div class="card">
        <h2 class="card-header">Deportistas</h2>
        <div class="card-body">

          
          <div class="d-flex justify-content-end align-items-center gap-2 mb-4">
              <div class="form-floating form-floating-outline" style="min-width: 180px;">
                <select id="deportistaFiltro" class="select2 form-select" data-allow-clear="true" data-placeholder="Deportista">
                  <option value=""></option>
                  {% for deportista in deportistas %}
                      <option value="{{ deportista.dni }}">{{ deportista.nombre }} {{ deportista.apellido }}</option>
                  {% endfor %}
                </select>
              </div>
              <div class="form-floating form-floating-outline" style="min-width: 180px;">
                <select id="categoriaFiltro" class="select2 form-select" data-allow-clear="true" data-placeholder="Categoría" >
                  <option value=""></option>
                  {% for cat in categorias %}
                      <option value="{{ cat.value }}">{{ cat.text }}</option>
                  {% endfor %}
                </select>
              </div>


              <div class="form-floating form-floating-outline" style="min-width: 180px;">
                <select id="divisionFiltro" class="select2 form-select" data-allow-clear="true" data-placeholder="División" >
                  <option value=""></option>
                  {% for div in divisiones %}
                      <option value="{{ div.value }}">{{ div.text }}</option>
                  {% endfor %}
                </select>
              </div>



              <div class="form-floating form-floating-outline" style="min-width: 180px;">
                <select id="ramaFiltro" class="select2 form-select" data-allow-clear="true" data-placeholder="Rama" >
                  <option value=""></option>
                  {% for rama in ramas %}
                      <option value="{{ rama.value }}">{{ rama.text }}</option>
                  {% endfor %}
                </select>
              </div>


            <button id="btnFiltrarDeportista" class="btn btn-primary waves-effect waves-light">
            Filtrar
          </button>
          </div>
        
          <div class="d-flex justify-content-end align-items-center gap-3 mb-5">
            <button class="btn btn-secondary buttons-collection btn-label-primary waves-effect waves-light btn-export" style="padding:10px;font-size:small;" type="button">
              <i class="ri-upload-line me-sm-1"></i> Exportar
            </button>
            <a href="javascript:;" class="btn btn-primary" data-bs-target="#addUser" data-bs-toggle="modal">
              Agregar
            </a>
          </div>
          <div class="table-responsive text-nowrap overflow-visible">
            <table id="tablaDeportista" class="table">
              <thead>
                <tr>
                  <th>DNI</th>
                  <th>Nombre</th>
                  <th>Apellido</th>
                  <th>Email</th> 
                  <th>Teléfono</th> 
                  <th>Categorías</th> 
                  <th>División</th> 
                  <th>Rama</th> 
                  <th>Estado</th> 
                  <th>Acciones</th>
                </tr>
              </thead>
            </table>
          </div>
                <!-- Modal -->
                <!-- Agregar User Modal -->
                <div class="modal fade" id="addUser" tabindex="-1" aria-hidden="true">
                  <div class="modal-dialog modal-lg modal-simple modal-edit-user">
                    <div class="modal-content">
                      <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                      <div class="modal-body p-0">
                        <div class="text-center mb-6">
                          <h4 class="mb-2" id="tituloAdd">Agregar Deportista</h4>
                          <div id="formError" class="alert alert-danger mx-4 d-none" role="alert"></div>
                        </div>
                        <form id="editDeportistaForm" class="row g-5" method="POST" action="{{ url_for('deportista.agregar_deportista') }}">
                          <div class="col-12 col-md-6">
                            <div class="form-floating form-floating-outline">
                              <input 
                                type="int"
                                id="dni"
                                name="dni"
                                class="form-control"
                                value=""
                                placeholder=""
                                required />
                              <label for="modalEditUserFirstName">DNI</label>
                            </div>
                          </div>
                          <div class="col-12 col-md-6">
                            <div class="form-floating form-floating-outline">
                              <input 
                                type="text"
                                id="nombre"
                                name="nombre"
                                class="form-control"
                                value=""
                                placeholder=""
                                required />
                              <label for="modalEditUserFirstName">Nombre</label>
                            </div>
                          </div>

                          <div class="col-12 col-md-6">
                            <div class="form-floating form-floating-outline">
                              <input
                                type="text"
                                id="apellido"
                                name="apellido"
                                class="form-control"
                                value=""
                                placeholder=""
                                required />
                              <label for="modalEditUserLastName">Apellido</label>
                            </div>
                          </div>
                          <div class="col-12 col-md-6">
                            <div class="form-floating form-floating-outline">
                              <input
                                type="text"
                                id="email"
                                name="email"
                                class="form-control"
                                value=""
                                placeholder=""
                                required />
                              <label for="modalEditUserLastName">Email</label>
                            </div>
                          </div>
                          <div class="col-12 col-md-6">
                            <div class="form-floating form-floating-outline">
                              <input
                                type="text"
                                id="telefono"
                                name="telefono"
                                class="form-control"
                                value=""
                                placeholder="" 
                                required/>
                              <label for="modalEditUserLastName">Teléfono</label>
                            </div>
                          </div>
                          
                          <div class="col-12 col-md-6">
                            <div class="form-floating form-floating-outline">
                              <input type="text" class="form-control" id="fechaNacimiento" name="fechaNacimiento" placeholder="Fecha Nacimiento" autocomplete="off" required>
                              <label for="fechaNacimiento">Fecha Nacimiento</label>
                            </div>
                          </div>
                          
                          <div class="col-12 col-md-6">
                            <div class="form-floating form-floating-outline form-floating-select2" data-select2-id="1">
                            <label for="categoria" class="form-label">Categoría</label>
                            <select class="select2 form-select" id="categoria" name="categoria" data-placeholder="Categoria" required>
                              <option value="">Seleccione una categoria</option>
                              {% for categoria in categorias %}
                                <option value="{{ categoria.text }}">{{ categoria.text }}</option>
                              {% endfor %}
                            </select>
                          </div>
                          </div>
                           <div class="col-12 col-md-6">
                            <div class="form-floating form-floating-outline form-floating-select2" data-select2-id="4">
                            <label for="categoriaExtra" class="form-label">Categoría Extra</label>
                            <select class="select2 form-select" id="categoriaExtra" name="categoriaExtra" data-placeholder="Categoria Extra" multiple="multiple">
                              <option value="">Seleccione una categoria</option>
                              {% for cat in categorias %}
                                <option value="{{ cat.text }}">{{ cat.text }}</option>
                              {% endfor %}
                            </select>
                          </div>
                          </div>
                        
                          <div class="col-12 col-md-6">
                            <div class="form-floating form-floating-outline form-floating-select2" data-select2-id="2">
                            <label for="division" class="form-label">Division</label>
                            <select class="select2 form-select" id="division" name="division" data-placeholder="Division" required>
                              <option value="">Seleccione una division</option>
                              {% for div in divisiones %}
                                <option value="{{ div.text }}">{{ div.text }}</option>
                              {% endfor %}
                            </select>
                          </div>
                          </div>

                          <div class="col-12 col-md-6">
                            <div class="form-floating form-floating-outline form-floating-select2" data-select2-id="3">
                            <label for="rama" class="form-label">Rama</label>
                            <select class="select2 form-select" id="rama" name="rama" data-placeholder="Rama" required>
                              <option value="">Seleccione una rama</option>
                              {% for rama in ramas %}
                                <option value="{{ rama.text}}">{{ rama.text }}</option>
                              {% endfor %}
                            </select>
                          </div>
                          </div>
                           <div class="col-12 col-md-6">
                            <div class="form-floating form-floating-outline form-floating-select2" data-select2-id="5">
                            <label for="localidad" class="form-label">Localidad</label>
                            <select class="select2 form-select" id="localidad" name="localidad" data-placeholder="Localidad" required>
                              <option value="">Seleccione una localidad</option>
                              {% for localidad in localidades %}
                                <option value="{{ localidad.text}}">{{ localidad.text }}</option>
                              {% endfor %}
                            </select>
                          </div>
                          </div>

                          
                          <div class="col-12 col-md-6">
                            <div class="form-floating form-floating-outline form-floating-select2" data-select2-id="5">
                            <label for="federado" class="form-label">Federado</label>
                            <select class="select2 form-select" id="federado" name="federado" data-placeholder="Federado" required>
                              <option value="">Federado</option>
                              {% for federado in federados %}
                                <option value="{{ federado.text}}">{{ federado.text }}</option>
                              {% endfor %}
                            </select>
                          </div>
                          </div>
                          
                          
                          <div class="col-12 text-center d-flex flex-wrap justify-content-center gap-4 row-gap-4">
                            <button type="submit" class="btn btn-primary" id="submitBtn">Crear</button>
                            <button
                              type="reset"
                              class="btn btn-outline-secondary"
                              data-bs-dismiss="modal"
                              aria-label="Close">
                              Cancelar
                            </button>
                          </div>
                        </form>
                      </div>
                    </div>
                  </div>
                </div>
                <!--/ Edit User Modal -->
                <!-- /Modal -->


        </div>
      </div>
    </div>
  </div>

  {% endblock %}

  {% block scripts %}
<script>
  flatpickr("#fechaNacimiento", { 
    locale: "es", 
    dateFormat: "d-m-Y",
    maxDate: "today"
  });

  let tabla = null;
  let firstLoad = true;
$(document).ready(function () {
  // Inicializar la tabla vacía
  tabla = $('#tablaDeportista').DataTable({
    ajax: {
      url: '/deportista/filtrar?init=1',
      dataSrc: function (json) {
        if (firstLoad) {
          firstLoad = false;
          return []; // ✅ vacío en la primera carga
        }
        return json && json.data ? json.data : [];
      }
    },
    language: {
      emptyTable: '<div class="text-center">Ningún dato disponible. Intente filtrar</div>'
    },
    columns: [
      { data: 'dni' },
      { data: 'nombre' },
      { data: 'apellido' },
      { data: 'email' },
      { data: 'telefono' },
      { data: 'categoria' },
      { data: 'division' },
      { data: 'rama' },
      {
        data: 'estado',
        render: function (data) {
          const badgeClass = data === 'Activo' ? 'bg-label-success' : 'bg-label-danger';
          return `<span class="badge rounded-pill ${badgeClass}">${data}</span>`;
        }
      },
      {
        data: null,
        orderable: false,
        searchable: false,
        render: function (data, type, row, meta) {
          const accion = row.estado === 'Activo' ? 'Deshabilitar' : 'Habilitar';
          return `
            <div class="dropdown" data-bs-boundary="viewport">
              <button type="button" class="btn p-0 dropdown-toggle hide-arrow" data-bs-toggle="dropdown">
                <i class="ri-more-2-line"></i>
              </button>
              <div class="dropdown-menu">
                <a class="dropdown-item" href="javascript:void(0);" onclick="editarFila(${meta.row})">
                  <i class="ri-pencil-line me-1"></i> Editar
                </a>
                <a class="dropdown-item" href="javascript:void(0);" onclick="eliminarFila(${meta.row})">
                  <i class="ri-delete-bin-7-line me-1"></i> Eliminar
                </a>
                <a class="dropdown-item cambiar-estado" href="javascript:void(0);" data-dni="${row.dni || ''}">
                  <i class="ri-refresh-line me-1"></i> ${accion}
                </a>
              </div>
            </div>`;
        }
      }
    ],
    paging: false,
    info: false,
    searching: false,
    ordering: true,
    dom: 'frtip',
    buttons: [
      {
        extend: 'excelHtml5',
        text: 'Exportar a Excel',
        title: 'Deportistas',
        className: 'buttons-excel',
        exportOptions: { columns: ':not(:last-child)' }
      }
    ],
     paging: true,
  pageLength: 10,                 // filas por página
  lengthMenu: [10, 25, 50, 100],  // opciones del selector
  info: true,
  pagingType: 'simple_numbers',   // o 'full_numbers' para «primero/último»
  autoWidth: false,

 

  language: {
    emptyTable:  '<div class="text-center">Ningún dato disponible. Intente filtrar</div>',
    zeroRecords: '<div class="text-center">Ningún dato disponible. Intente filtrar</div>',
    lengthMenu:  "Mostrar _MENU_",
    info:        "Mostrando _START_ a _END_ de _TOTAL_",
    infoEmpty:   "Mostrando 0 a 0 de 0",
    infoFiltered:"(filtrado de _MAX_ en total)",
    paginate: {
      previous: '<i class="ri-arrow-left-s-line"></i>',
      next:     '<i class="ri-arrow-right-s-line"></i>',
      first:    'Primero',
      last:     'Último'
    }
  },
    initComplete: function () {
      $('#tablaDeportista').removeClass('dataTable no-footer stripe hover').addClass('table');
    }
  });
  });
  // Botón Exportar
  $('.btn-export').on('click', function () {
    if (tabla) tabla.button('.buttons-excel').trigger();
  });

  // ✅ Botón Filtrar
  $('#btnFiltrarDeportista').on('click', function () {
    filtrar();
  });

  // Función filtrar
  function filtrar() {
    const categoria = $('#categoriaFiltro').val();
    const division = $('#divisionFiltro').val();
    const rama = $('#ramaFiltro').val();
    const dni = $('#deportistaFiltro').val();

    const url = `/deportista/filtrar?categoria=${encodeURIComponent(categoria || '')}&division=${encodeURIComponent(division || '')}&rama=${encodeURIComponent(rama || '')}&dni=${encodeURIComponent(dni || '')}`;
    tabla.ajax.url(url).load();
  }

  // ✅ Botón Limpiar
  function limpiar() {
    $('#categoriaFiltro').val('').trigger('change');
    $('#ramaFiltro').val('').trigger('change');
    $('#divisionFiltro').val('').trigger('change');
    $('#deportistaFiltro').val('').trigger('change');
    filtrar();
  }

  // Editar fila
  function editarFila(rowIndex) {
    const data = tabla.row(rowIndex).data();
    const dni = data.dni;

    fetch(`/deportista/getDeportista/${dni}`, {
      headers: { 'X-Requested-With': 'XMLHttpRequest' }
    })
      .then(async r => {
        if (!r.ok) {
          const e = await r.json();
          throw new Error(e.message || 'Error al cargar datos del deportista');
        }
        return r.json();
      })
      .then(detalle => {
        $('#dni').val(detalle.dni);
        $('#nombre').val(detalle.nombre);
        $('#apellido').val(detalle.apellido);
        $('#email').val(detalle.email);
        $('#telefono').val(detalle.telefono);

        $('#categoria').val(detalle.categoria).trigger('change');
        $('#rama').val(detalle.rama).trigger('change');
        $('#division').val(detalle.division).trigger('change');
        $('#federado').val(detalle.federado).trigger('change');

        if (detalle.categoriaExtra) {
          const extras = Array.isArray(detalle.categoriaExtra)
            ? detalle.categoriaExtra
            : detalle.categoriaExtra.split(',');
          $('#categoriaExtra').val(extras).trigger('change');
        } else {
          $('#categoriaExtra').val(null).trigger('change');
        }

        if (detalle.fechaNacimiento) {
          $('#fechaNacimiento').val(detalle.fechaNacimiento);
        }

        $('#editDeportistaForm').attr('action', `/deportista/editar/${detalle.dni}`);
        $('#submitBtn').text('Actualizar');
        $('#tituloAdd').text('Editar Deportista');
        $('#addUser').modal('show');
      })
      .catch(err => {
        Swal.fire({ icon: 'error', title: 'Error', text: err.message || 'No se pudo cargar el deportista' });
      });
  }

  // Eliminar fila
  function eliminarFila(rowIndex) {
    const data = tabla.row(rowIndex).data();

    Swal.fire({
      title: '¿Estás segura/o?',
      text: `Vas a eliminar a ${data.nombre} ${data.apellido}`,
      icon: 'warning',
      showCancelButton: true,
      confirmButtonText: 'Sí, eliminar',
      cancelButtonText: 'Cancelar'
    }).then((result) => {
      if (result.isConfirmed) {
        fetch(`/deportista/eliminar/${data.dni}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'XMLHttpRequest' }
        })
          .then(async r => {
            if (!r.ok) {
              const e = await r.json();
              throw new Error(e.message || 'Error desconocido');
            }
            return r.json();
          })
          .then(data => {
            Swal.fire({ icon: 'success', title: 'Eliminado', text: data.message, showConfirmButton: false, timer: 2000 });
            tabla.ajax.reload();
          })
          .catch(err => {
            Swal.fire({ icon: 'error', title: 'Error', text: err.message || 'Hubo un error al intentar eliminar el deportista.' });
          });
      }
    });
  }

  // Cambiar estado
  $('#tablaDeportista').on('click', '.cambiar-estado', function () {
    const dni = $(this).data('dni');

    fetch(`/deportista/cambiarEstado/${dni}`, {
      method: 'POST',
      headers: { 'X-Requested-With': 'XMLHttpRequest' }
    })
      .then(async r => {
        if (!r.ok) {
          const e = await r.json();
          throw new Error(e.message || 'Error desconocido');
        }
        return r.json();
      })
      .then(data => {
        Swal.fire({
          icon: 'success',
          title: 'Estado actualizado',
          text: `Nuevo estado: ${data.nuevo_estado}`,
          timer: 2000,
          showConfirmButton: false
        });
        tabla.ajax.reload(null, false);
      })
      .catch(err => {
        Swal.fire({ icon: 'error', title: 'Error al cambiar estado', text: err.message || 'Ocurrió un error inesperado' });
      });
  });

  // ✅ Submit del formulario (crear/editar deportista)
  $('#editDeportistaForm').on('submit', function (e) {
    e.preventDefault();

    const form = this;
    const actionUrl = $(form).attr('action');
    const formData = new FormData(form);

    fetch(actionUrl, {
      method: 'POST',
      body: formData,
      headers: { 'X-Requested-With': 'XMLHttpRequest' }
    })
      .then(async r => {
        if (!r.ok) {
          const e = await r.json();
          throw new Error(e.message || 'Error al guardar el deportista');
        }
        return r.json();
      })
      .then(data => {
        Swal.fire({
          icon: 'success',
          title: data.message.includes('creado') ? 'Deportista creado' : 'Deportista actualizado',
          text: data.message,
          timer: 2000,
          showConfirmButton: false
        });
        $('#addUser').modal('hide');
        $('#editDeportistaForm')[0].reset();
        $('#categoria, #rama, #division, #federado, #categoriaExtra').val(null).trigger('change');
        $('#editDeportistaForm').attr('action', '{{ url_for("deportista.agregar_deportista") }}');
        $('#submitBtn').text('Crear');
        $('#tituloAdd').text('Agregar Deportista');
        if (tabla) tabla.ajax.reload();
      })
      .catch(err => {
        const errorDiv = document.getElementById('formError');
        errorDiv.textContent = err.message;
        errorDiv.classList.remove('d-none');
        // ❌ No cierro el modal, lo dejo abierto para corregir
      });
  });

  // ✅ Reset modal al cerrarse (para limpiar siempre)
  $('#addUser').on('hidden.bs.modal', function () {
    const form = $('#editDeportistaForm')[0];
    form.reset();
    $('#categoria, #rama, #division, #federado, #categoriaExtra').val(null).trigger('change');
    $('#editDeportistaForm').attr('action', '{{ url_for("deportista.agregar_deportista") }}');
    $('#submitBtn').text('Crear');
    $('#tituloAdd').text('Agregar Deportista');
    const errorDiv = document.getElementById('formError');
    if (errorDiv) {
      errorDiv.classList.add('d-none');
      errorDiv.textContent = '';
    }
  });
</script>


  <!-- DataTables Buttons CSS -->
  <link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.1/css/buttons.dataTables.min.css"/>

  <!-- DataTables y Buttons JS -->
  <script src="https://cdn.datatables.net/buttons/2.4.1/js/dataTables.buttons.min.js"></script>
  <script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.html5.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  {% endblock %}
